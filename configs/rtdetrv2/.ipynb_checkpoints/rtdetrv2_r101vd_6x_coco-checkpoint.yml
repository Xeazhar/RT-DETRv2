__include__: [
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r101vd.yml',
]


output_dir: ./output/rtdetrv2_r101vd_6x_coco

PResNet:
  depth: 101


HybridEncoder:
  # intra
  hidden_dim: 384
  dim_feedforward: 2048


RTDETRTransformerv2:
  feat_channels: [384, 384, 384]

epochs: 120


optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00003
    - 
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Add this to override the included scheduler
lr_scheduler:
  type: MultiStepLR
  milestones: [85,100] # Push the "drop" far into the future
  gamma: 0.1

train_dataloader: 
  dataset: 
    type: CocoDetection
    transforms:
      policy:
        epoch: 120
  collate_fn:
    stop_epoch: 70

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']